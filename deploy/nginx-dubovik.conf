# /etc/nginx/sites-available/dubovik
# После покупки домена замените server_name _; на server_name vash-domen.by;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/dubovik;
    index index.html;

    access_log /var/log/nginx/dubovik.access.log;
    error_log /var/log/nginx/dubovik.error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:8099/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=300";
    }

    location ~* \.(mp4|webm)$ {
        add_header Cache-Control "public, max-age=86400";
    }
}
