# /etc/nginx/sites-available/ot-pb-by
# Сайт Дубовик В.В. — домен ot-pb.by (не трогает PRD-BOT)
# Установка: bash deploy/setup_ot_pb_domain.sh --nginx-only

server {
    listen 80;
    listen [::]:80;
    server_name ot-pb.by www.ot-pb.by;

    root /var/www/dubovik;
    index index.html;

    access_log /var/log/nginx/ot-pb-by.access.log;
    error_log /var/log/nginx/ot-pb-by.error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:8099/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=300";
    }

    location ~* \.(mp4|webm)$ {
        add_header Cache-Control "public, max-age=86400";
    }
}
